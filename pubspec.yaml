name: tanami_capital_task
description: "Tanami Capital Task."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.19.0
  multiple_result: ^5.1.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  equatable: ^2.0.7
  fluttertoast: ^8.2.12
  shimmer: ^3.0.0
  lottie: ^3.3.1
  phone_numbers_parser: ^9.0.3
  syncfusion_flutter_charts: ^28.2.11
  local_auth: ^2.3.0
  syncfusion_flutter_pdfviewer: ^28.2.11
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0
  build_runner: 2.4.14
  flutter_gen_runner:
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.4.5
  test: any

flutter_gen:
  output: lib/app_core/style/images
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/svg/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

